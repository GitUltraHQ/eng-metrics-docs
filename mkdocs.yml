site_name: eng-metrics-suite
site_description: Self-hosted engineering metrics pipeline -- docs
site_url: https://docs.gitultra.com/
repo_url: https://github.com/GitUltraHQ/eng-metrics-suite
repo_name: GitUltraHQ/eng-metrics-suite

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Discovering Repos: discovering-repos.md
  - Repo Renames & Duplicate Repos: repo-renames.md
  - Jira Integration (Optional): jira-integration.md
  - Running Workers: running-workers.md
  - Generating Reports: generating-reports.md
  - API Access (Team / Enterprise): api-access.md
  - AI Agent Access (Team / Enterprise): mcp-access.md
  - Author Identity Consistency: author-identity.md
  - Scheduling Reports: scheduling.md
  - Logs: logs.md
  - Telemetry: telemetry.md
  - Updating: updating.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
