site_name: GitUltra Docs
site_description: Self-hosted engineering metrics pipeline -- docs
site_url: https://docs.gitultra.com/
repo_url: https://github.com/GitUltraHQ/eng-metrics-suite
repo_name: GitUltraHQ/eng-metrics-suite

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Nunito Sans
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

nav:
  - Home: index.md
  - Setup:
      - Getting Started: getting-started.md
      - Discovering Repos: discovering-repos.md
      - Jira Integration (Optional): jira-integration.md
      - Running Workers: running-workers.md
  - Reports:
      - Generating Reports: generating-reports.md
      - Investment Allocation: investment-allocation.md
      - Planning Quality Signals: planning-quality-signals.md
      - Executive Report (Enterprise): executive-report.md
      - Scheduling Reports: scheduling.md
  - Team & Enterprise:
      - API Access: api-access.md
      - AI Agent Access: mcp-access.md
  - Data Quality:
      - Author Identity Consistency: author-identity.md
      - Repo Renames & Duplicate Repos: repo-renames.md
  - Operations:
      - Updating: updating.md
      - Logs: logs.md
      - Telemetry: telemetry.md

extra_css:
  - stylesheets/gitultra.css

copyright: >-
  &copy; 2026 <a href="https://gitultra.com" target="_blank" rel="noopener">GitUltra</a>

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

# Google Analytics 4, gated by Material's built-in cookie-consent banner
# below -- gtag.js only loads after a visitor clicks "Accept" (or has
# already done so on a past visit); declining or ignoring the banner
# means no analytics data is sent for that visit. See
# https://squidfunk.github.io/mkdocs-material/setup/setting-up-site-analytics/
# and https://squidfunk.github.io/mkdocs-material/setup/setting-up-a-blog/#consent
# for how Material wires this together -- no custom JS needed here,
# unlike gitultra-site's hand-built equivalent.
extra:
  generator: false
  social:
    - icon: material/web
      link: https://gitultra.com
      name: gitultra.com
    - icon: fontawesome/brands/github
      link: https://github.com/GitUltraHQ
      name: GitUltraHQ on GitHub
  analytics:
    provider: google
    property: G-2C8NVN73HS
  consent:
    title: Cookie consent
    description: >-
      We use Google Analytics to understand how visitors use this
      documentation site -- pages viewed, referring site, and general
      usage patterns -- so we can improve it. This only runs if you
      accept below; declining means no analytics data is collected for
      your visit. See GitUltra's
      <a href="https://gitultra.com/privacy" target="_blank" rel="noopener">Privacy Policy</a>
      for more detail.
